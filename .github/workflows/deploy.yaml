name: Nutricare_Client Auto-Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable

    steps:
      - name: Get my code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: flutter pub get

      # 🕵️ THE QUALITY INSPECTOR: Checks for messy code and crash risks
          # 🕵️ THE QUALITY INSPECTOR: Now set to 'fatal' only so it doesn't stop on warnings
      - name: Analyze Dart Code
        run: flutter analyze --fatal-infos --fatal-warnings
        continue-on-error: true # This ensures the build continues even if your code is a bit "messy"

      # 🛡️ THE SECURITY GUARD: Checks for known hacker vulnerabilities
      - name: Run OSV Vulnerability Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            -r
            ./

      # 🔐 Step A: Recreate the Keystore file from your Secret
      - name: Recreate Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > android/app/nutricare-release.jks

      # 🏗️ Step B: Build All Three Variants
      - name: Build Variants
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Build Signed Release APK (For Direct Download)
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/client-signed.apk

          # 2. Build Unsigned Debug APK (For Testing)
          flutter build apk --debug
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/client-unsigned.apk

          # 3. Build Signed Release AAB (For Google Play Store)
          flutter build appbundle --release
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/client-signed.aab

      # 🚀 Step C: Upload Signed APK to Cloudinary
      - name: Upload Signed APK to Cloudinary
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          curl https://api.cloudinary.com/v1_1/$CLOUD_NAME/raw/upload \
            -X POST \
            -F "file=@build/app/outputs/flutter-apk/client-signed.apk" \
            -F "upload_preset=$UPLOAD_PRESET" \
            -F "folder=nutricare/client_app" \
            -F "public_id=client_latest_signed" \
            -F "overwrite=true"

      # 🚀 Step D: Upload Unsigned APK to Cloudinary
      - name: Upload Unsigned APK to Cloudinary
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          curl https://api.cloudinary.com/v1_1/$CLOUD_NAME/raw/upload \
            -X POST \
            -F "file=@build/app/outputs/flutter-apk/client-unsigned.apk" \
            -F "upload_preset=$UPLOAD_PRESET" \
            -F "folder=nutricare/client_app" \
            -F "public_id=client_latest_unsigned" \
            -F "overwrite=true"

      # 🚀 Step E: Upload AAB (App Bundle) to Cloudinary
      - name: Upload AAB to Cloudinary
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          curl https://api.cloudinary.com/v1_1/$CLOUD_NAME/raw/upload \
            -X POST \
            -F "file=@build/app/outputs/bundle/release/client-signed.aab" \
            -F "upload_preset=$UPLOAD_PRESET" \
            -F "folder=nutricare/client_app" \
            -F "public_id=client_latest_playstore_bundle" \
            -F "overwrite=true"