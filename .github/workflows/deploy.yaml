name: Nutricare_client CI/CD

on:
  push:
    branches:
      - main
      - development

jobs:
  quality_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze
        continue-on-error: true

      - name: Run OSV Security Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |
            -r
            --fail-on-cvss=5
            ./

  deploy_production:
    needs: quality_check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔥 Free disk space
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      # 🔥 Add swap memory (CRITICAL FIX)
      - name: Enable Swap Memory
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile

          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install Dependencies
        run: flutter pub get

      # 🔐 Recreate keystore
      - name: Recreate Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > android/app/nutricare-release.jks

      # 🔐 Create key.properties (REQUIRED FOR SIGNING)
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=nutricare-release.jks" >> android/key.properties

      # 🧹 Clean project
      - name: Clean Project
        run: flutter clean

      # 🚀 Build APK (STABLE VERSION)
      - name: Build APK
        env:
          _JAVA_OPTIONS: "-Xmx4g"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      # ☁️ Upload to Cloudinary
      - name: Upload to Cloudinary
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          FILE_PATH="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"

          echo "Uploading $FILE_PATH..."

          curl https://api.cloudinary.com/v1_1/$CLOUD_NAME/raw/upload \
            -X POST \
            -F "file=@$FILE_PATH" \
            -F "upload_preset=$UPLOAD_PRESET" \
            -F "folder=nutricare/client_app" \
            -F "public_id=client_latest_release_apk" \
            -F "overwrite=true"